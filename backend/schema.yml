          format: uri
          readOnly: true
          nullable: true
          title: Miniatura
        original_filename:
          type: string
          readOnly: true
          title: Nombre original
        content_type:
          type: string
          readOnly: true
          title: Tipo de contenido
        size_bytes:
          type: integer
          readOnly: true
          title: Peso en bytes
        width:
          type: integer
          readOnly: true
          nullable: true
