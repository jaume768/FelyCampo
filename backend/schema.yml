      description: |-
        Pedidos del cliente. Solo lectura.

        No expone el estado del envío: de la logística se encarga una empresa externa y al
        cliente se le remite a su correo o al teléfono de la tienda.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Cancela un pedido que aún no se ha pagado y libera su reserva de
        stock.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/request-invoice/:
    post:
      operationId: orders_request_invoice_create
      description: |-
        Pide la factura. No se genera PDF: se manda un correo a administración con los
        datos del cliente, las líneas y el total, para emitirla a mano.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/orders/{id}/returns/:
    post:
      operationId: orders_returns_create
      description: |-
        Solicita una devolución, total o parcial. Plazo de 14 días y retorno a cargo del
        cliente. Queda en «solicitada» hasta que el panel la acepte.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
  /api/v1/orders/lookup/:
    get:
      operationId: orders_lookup_retrieve
      description: |-
        Consulta de un pedido hecho **sin cuenta**, mediante el token que se envía al comprador.

        No se busca por referencia + email a propósito: la referencia es correlativa
        (`FC-001000`, `FC-001001`…), así que con el correo de una persona se podría recorrer el
        rango entero y extraer direcciones postales, teléfonos e importes. El token es un
        secreto de 256 bits, no enumerable, y además el endpoint va limitado por ritmo.
      tags:
      - orders
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/webhooks/stripe/:
    post:
      operationId: webhooks_stripe_create
      description: |-
        Webhook de Stripe. Confirma el pago y descuenta el stock.

        Es idempotente: Stripe reintenta, y aplicar dos veces el mismo evento dejaría el
        almacén descuadrado.
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: No response body
