        name: kind
        schema:
          type: string
          title: Tipo
          enum:
          - bundle
          - simple
        description: |-
          * `simple` - Prenda
          * `bundle` - Conjunto
      - in: query
        name: line
        schema:
          type: string
          title: Línea
          enum:
          - archive
          - atelier
          - pret_a_porter
