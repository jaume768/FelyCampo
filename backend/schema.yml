      - province
      - recipient
    Cart:
      type: object
      description: 'Carrito con el desglose ya calculado: envío, IVA y total.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        totals:
          type: object
          additionalProperties: {}
          readOnly: true
        has_stock_issues:
          type: boolean
          description: Avisa al frontend de que alguna línea ya no puede servirse.
          readOnly: true
      required:
      - has_stock_issues
      - id
      - items
      - totals
    CartItem:
      type: object
      description: Línea de carrito con el precio vivo del catálogo, en neto y con
        IVA.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          title: Variante
        quantity:
          type: integer
          maximum: 32767
          minimum: 1
          title: Cantidad
        sku:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
        color_name:
          type: string
          readOnly: true
        size_code:
          type: string
          readOnly: true
        image:
          type: string
          nullable: true
          readOnly: true
        unit_price_net:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        unit_price_gross:
          type: string
          readOnly: true
        line_gross:
          type: string
          readOnly: true
        has_stock:
          type: boolean
          readOnly: true
        available:
          type: integer
          readOnly: true
      required:
      - available
      - color_name
      - has_stock
      - id
      - image
      - line_gross
      - product_name
      - product_slug
      - size_code
      - sku
      - unit_price_gross
      - unit_price_net
      - variant
    CartItemWrite:
      type: object
      description: Alta o cambio de cantidad de una línea.
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
