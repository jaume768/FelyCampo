          - $ref: '#/components/schemas/Family'
          readOnly: true
        line:
          allOf:
          - $ref: '#/components/schemas/LineEnum'
          title: Línea
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Tipo
        sale_mode:
          allOf:
          - $ref: '#/components/schemas/SaleModeEnum'
          title: Modo de venta
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Precio sin IVA
          description: PVP **sin IVA**. Vacío solo en productos de tipo «solo consulta».
        sale_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Precio rebajado sin IVA
          description: Si está relleno, es el precio que se cobra.
        price_gross:
          type: string
          nullable: true
          readOnly: true
        sale_price_gross:
          type: string
          nullable: true
          readOnly: true
        effective_price_gross:
          type: string
          nullable: true
          readOnly: true
        is_on_sale:
          type: boolean
          readOnly: true
        is_outlet:
          type: boolean
          title: En outlet
        primary_image:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        colors:
          type: array
          items: {}
          readOnly: true
        in_stock:
          type: boolean
          readOnly: true
        description:
          type: string
          title: Descripción
        description_en:
          type: string
          title: Descripción (EN)
        composition:
          type: string
          title: Composición
          maxLength: 255
        care:
          type: string
          title: Cuidados
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
        colorways:
          type: array
          items: {}
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          readOnly: true
        components:
          type: array
          items: {}
          description: Piezas de un conjunto. Vacío en prendas sueltas.
          readOnly: true
        enquiry_only:
          type: boolean
          description: True cuando el producto no tiene precio y hay que consultar
            por email.
          readOnly: true
      required:
      - categories
      - colors
      - colorways
      - components
      - effective_price_gross
      - enquiry_only
      - family
      - id
      - images
      - in_stock
      - is_on_sale
      - name
      - price_gross
      - primary_image
      - sale_price_gross
    ProductEnquiry:
      type: object
      description: |-
        Consulta sobre un producto sin precio. Los artículos `ON_REQUEST` no se compran: se
        pregunta por email. No se persiste nada, solo se envía el aviso.
      properties:
        product:
          type: string
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
          default: ''
          maxLength: 32
        message:
          type: string
          maxLength: 2000
      required:
      - email
      - message
      - name
      - product
    ProductImage:
      type: object
      description: |-
        `image` sigue siendo la URL del archivo, igual que antes de Fase 2 — la API pública
        no cambia de forma aunque por dentro `ProductImage` ya no guarde el archivo, solo
        referencie un `media.MediaAsset` (biblioteca reutilizable, ver apps/media/).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          readOnly: true
        alt_text:
          type: string
          title: Texto alternativo
          maxLength: 200
        position:
          type: integer
          maximum: 32767
          minimum: 0
          title: Orden
        colorway:
          type: string
          format: uuid
          nullable: true
          title: Color de producto
      required:
      - id
      - image
    ProductList:
      type: object
      description: |-
        Versión ligera para listados y rejillas.

        `line` se añadió aquí (y como filtro en `ProductFilter`) para que la web pública pueda
        separar Prêt-à-porter/Atelier/Archivo — hasta ahora solo lo sabía el panel admin
        (`Product.line`, Fase 2). Es un añadido puro (campo nuevo, nada renombrado ni de tipo
        distinto), permitido por la regla de "la forma de la API pública no cambia" de
        CLAUDE.md, que sí deja añadir campos.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          title: Nombre
          maxLength: 200
        name_en:
          type: string
          title: Nombre (EN)
          maxLength: 200
        family:
          allOf:
          - $ref: '#/components/schemas/Family'
          readOnly: true
        line:
          allOf:
          - $ref: '#/components/schemas/LineEnum'
          title: Línea
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Tipo
        sale_mode:
          allOf:
          - $ref: '#/components/schemas/SaleModeEnum'
          title: Modo de venta
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Precio sin IVA
          description: PVP **sin IVA**. Vacío solo en productos de tipo «solo consulta».
        sale_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Precio rebajado sin IVA
          description: Si está relleno, es el precio que se cobra.
        price_gross:
          type: string
          nullable: true
          readOnly: true
        sale_price_gross:
          type: string
          nullable: true
          readOnly: true
        effective_price_gross:
          type: string
          nullable: true
          readOnly: true
        is_on_sale:
          type: boolean
          readOnly: true
        is_outlet:
          type: boolean
          title: En outlet
        primary_image:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        colors:
          type: array
          items: {}
          readOnly: true
        in_stock:
          type: boolean
          readOnly: true
      required:
      - colors
      - effective_price_gross
      - family
      - id
      - in_stock
      - is_on_sale
      - name
      - price_gross
      - primary_image
      - sale_price_gross
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          title: Correo electrónico
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 100
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        phone:
          type: string
          title: Teléfono
          maxLength: 32
        accepts_marketing:
          type: boolean
          title: Acepta comunicaciones
      required:
      - email
      - password
    Return:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: string
          format: uuid
          title: Pedido
        status:
          allOf:
          - $ref: '#/components/schemas/ReturnStatusEnum'
          readOnly: true
          title: Estado
        reason:
          type: string
          title: Motivo
        refund_amount_gross:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Importe reembolsado con IVA
        refunded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Reembolsado el
          description: Se rellena a mano tras ejecutar el reembolso en Stripe.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLine'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lines
      - order
      - refund_amount_gross
      - refunded_at
      - status
    ReturnCreate:
      type: object
      description: |-
        Solicitud de devolución, total o parcial. Plazo de 14 días; el retorno lo paga el
        cliente. Aquí solo se registra: la aceptación y el reembolso los hace el panel.
      properties:
        reason:
          type: string
          maxLength: 2000
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineWrite'
      required:
      - lines
      - reason
    ReturnLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_line:
          type: string
          format: uuid
          title: Línea de pedido
        sku:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 1
          title: Cantidad
      required:
      - id
      - order_line
      - product_name
      - quantity
      - sku
    ReturnLineWrite:
      type: object
      properties:
        order_line:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required:
      - order_line
      - quantity
    ReturnStatusEnum:
      enum:
      - requested
      - accepted
      - rejected
      type: string
      description: |-
        * `requested` - Solicitada
        * `accepted` - Aceptada
        * `rejected` - Rechazada
    SaleModeEnum:
      enum:
      - in_stock
      - on_request
      - made_to_order
      type: string
      description: |-
        * `in_stock` - Disponible en stock
        * `on_request` - Solo consulta (sin precio)
        * `made_to_order` - Bajo encargo
    Size:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          title: Talla
          maxLength: 8
        position:
          type: integer
          maximum: 32767
          minimum: 0
          title: Orden
      required:
      - code
      - id
    StatusEnum:
      enum:
      - draft
      - active
      - archived
      type: string
      description: |-
        * `draft` - Borrador
        * `active` - Activo
        * `archived` - Archivado
    StockNotification:
      type: object
      description: '«Avísame cuando haya stock». No exige cuenta: basta un email.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          title: Variante
        email:
          type: string
          format: email
          title: Correo electrónico
          maxLength: 254
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - variant
    User:
      type: object
      description: Datos del cliente en su área privada.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
        first_name:
          type: string
          title: Nombre
          maxLength: 100
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          title: Teléfono
          maxLength: 32
        accepts_marketing:
          type: boolean
          title: Acepta comunicaciones
        email_verified:
          type: boolean
          readOnly: true
          title: Correo verificado
          description: 'Confirma que la dirección pertenece a quien se registró. No
            bloquea el acceso: es una decisión de producto pendiente (ver DECISIONS_PENDING.md).'
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Alta
      required:
      - date_joined
      - email
      - email_verified
      - full_name
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
