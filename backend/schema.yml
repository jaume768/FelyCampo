openapi: 3.0.3
info:
  title: Fely Campo API
  version: 1.0.0
  description: API REST de Fely Campo
paths:
  /api/v1/account/addresses/:
    get:
      operationId: account_addresses_list
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: account_addresses_create
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/account/addresses/{id}/:
    get:
      operationId: account_addresses_retrieve
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este dirección.
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: account_addresses_update
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este dirección.
        required: true
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: account_addresses_partial_update
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este dirección.
        required: true
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: account_addresses_destroy
      description: Direcciones del cliente. Cada uno solo ve las suyas.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este dirección.
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/account/favorites/:
    get:
      operationId: account_favorites_list
      description: Favoritos del área privada.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
          description: ''
    post:
      operationId: account_favorites_create
      description: Favoritos del área privada.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Favorite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Favorite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Favorite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
          description: ''
  /api/v1/account/favorites/{id}/:
    delete:
      operationId: account_favorites_destroy
      description: Favoritos del área privada.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este favorito.
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/account/me/:
    get:
      operationId: account_me_retrieve
      description: Datos del cliente. GET para leerlos, PATCH para editarlos.
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: account_me_update
      description: Datos del cliente. GET para leerlos, PATCH para editarlos.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: account_me_partial_update
      description: Datos del cliente. GET para leerlos, PATCH para editarlos.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Entrega la cookie CSRF. El frontend la pide una vez antes del primer
        POST.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: Marca el correo como verificado. El token de Django caduca solo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Pide el enlace de restablecimiento.

        Responde **204 siempre**, exista o no la cuenta: si distinguiera, cualquiera podría
        comprobar qué correos están registrados en la tienda.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Fija la nueva contraseña a partir del enlace recibido por correo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Alta de cliente. Deja la sesión iniciada para no pedir login justo
        después.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      description: |-
        Carrito actual, con el desglose de IVA y envío ya calculado.

        El `GET` **no crea nada**: si aún no hay carrito devuelve uno vacío con `id: null`. El
        carrito nace en el primer `POST`, y es entonces cuando el frontend recibe el `id` que
        debe guardar y mandar en `X-Cart-Id`.
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_create
      description: Añade una variante o **suma** a la cantidad que ya hubiera.
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/{item_id}/:
    patch:
      operationId: cart_items_partial_update
      description: Cambia la cantidad de una línea o la elimina.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemWrite'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Cambia la cantidad de una línea o la elimina.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: Árbol de categorías. Devuelve solo las raíces; las hijas van anidadas.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/enquiries/:
    post:
      operationId: catalog_enquiries_create
      description: |-
        Consulta sobre un producto sin precio. Envía el mensaje a la dirección configurada;
        no se guarda nada en base de datos.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEnquiry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductEnquiry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductEnquiry'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/catalog/families/:
    get:
      operationId: catalog_families_list
      description: Familias activas, para los menús de navegación.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Family'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      description: |-
        Catálogo público. Solo productos publicados: los borradores no se filtran, no existen
        para esta API.

        Se busca y se recupera por `slug`, que es lo que va en la URL del frontend.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: color
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: string
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: is_outlet
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          title: Tipo
          enum:
          - bundle
          - simple
        description: |-
          * `simple` - Prenda
          * `bundle` - Conjunto
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - in: query
        name: sale_mode
        schema:
          type: string
          title: Modo de venta
          enum:
          - in_stock
          - made_to_order
          - on_request
        description: |-
          * `in_stock` - Disponible en stock
          * `on_request` - Solo consulta (sin precio)
          * `made_to_order` - Bajo encargo
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: size
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: catalog_products_retrieve
      description: |-
        Catálogo público. Solo productos publicados: los borradores no se filtran, no existen
        para esta API.

        Se busca y se recupera por `slug`, que es lo que va en la URL del frontend.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/sizes/:
    get:
      operationId: catalog_sizes_list
      description: Tallas activas. Lista cerrada y común a todo el catálogo.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Size'
          description: ''
  /api/v1/catalog/stock-notifications/:
    post:
      operationId: catalog_stock_notifications_create
      description: |-
        «Avísame cuando haya stock». No requiere cuenta: basta el email y la variante.
        Repetir la petición no duplica el aviso.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockNotification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockNotification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockNotification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockNotification'
          description: ''
  /api/v1/checkout/:
    post:
      operationId: checkout_create
      description: |-
        Cierra el carrito: crea el pedido, **reserva el stock 1 hora** y devuelve el
        `client_secret` de Stripe para que el frontend cobre el 100%.

        El pedido no se da por pagado aquí: eso lo confirma el webhook de Stripe.
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 200 si la base de datos responde; 503 en caso contrario. El campo
        `cache` informa del estado de Redis, pero no afecta al código de respuesta.
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/live/:
    get:
      operationId: health_live_retrieve
      description: 200 si el proceso Django está vivo. No comprueba dependencias.
      summary: Liveness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: 200 si la base de datos responde; 503 en caso contrario. El campo
        `cache` informa del estado de Redis, pero no afecta al código de respuesta.
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/orders/:
    get:
      operationId: orders_list
      description: |-
        Pedidos del cliente. Solo lectura.

        No expone el estado del envío: de la logística se encarga una empresa externa y al
        cliente se le remite a su correo o al teléfono de la tienda.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: orders_retrieve
      description: |-
        Pedidos del cliente. Solo lectura.

        No expone el estado del envío: de la logística se encarga una empresa externa y al
        cliente se le remite a su correo o al teléfono de la tienda.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Cancela un pedido que aún no se ha pagado y libera su reserva de
        stock.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/request-invoice/:
    post:
      operationId: orders_request_invoice_create
      description: |-
        Pide la factura. No se genera PDF: se manda un correo a administración con los
        datos del cliente, las líneas y el total, para emitirla a mano.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/orders/{id}/returns/:
    post:
      operationId: orders_returns_create
      description: |-
        Solicita una devolución, total o parcial. Plazo de 14 días y retorno a cargo del
        cliente. Queda en «solicitada» hasta que el panel la acepte.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este pedido.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
  /api/v1/orders/lookup/:
    get:
      operationId: orders_lookup_retrieve
      description: |-
        Consulta de un pedido hecho **sin cuenta**, mediante el token que se envía al comprador.

        No se busca por referencia + email a propósito: la referencia es correlativa
        (`FC-001000`, `FC-001001`…), así que con el correo de una persona se podría recorrer el
        rango entero y extraer direcciones postales, teléfonos e importes. El token es un
        secreto de 256 bits, no enumerable, y además el endpoint va limitado por ritmo.
      tags:
      - orders
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/webhooks/stripe/:
    post:
      operationId: webhooks_stripe_create
      description: |-
        Webhook de Stripe. Confirma el pago y descuenta el stock.

        Es idempotente: Stripe reintenta, y aplicar dos veces el mismo evento dejaría el
        almacén descuadrado.
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: No response body
components:
