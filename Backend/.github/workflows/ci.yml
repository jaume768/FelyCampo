name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: felycampo
          POSTGRES_USER: felycampo
          POSTGRES_PASSWORD: felycampo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felycampo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-not-for-production
      DATABASE_URL: postgres://felycampo:felycampo@localhost:5432/felycampo
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies (reproducible)
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements/dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format --check
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

      - name: OpenAPI schema validation
        run: python manage.py spectacular --validate --fail-on-warn --file schema.yml

      - name: Django deploy check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
        run: python manage.py check --deploy

      - name: pip-audit
        run: pip-audit
