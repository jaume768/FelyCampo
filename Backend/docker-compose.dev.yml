services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-felycampo}
      POSTGRES_USER: ${POSTGRES_USER:-felycampo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-felycampo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 en el host: el 5432 suele estar ocupado por un Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-felycampo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    command: /app/scripts/entrypoint-dev.sh
    env_file: .env
    volumes:
      - .:/app                    # código montado: recarga automática
    ports:
      - "8001:8000"               # 8001 en el host: el 8000 ya estaba ocupado
      - "5678:5678"               # debugpy (solo desarrollo)
    depends_on:
      db:
        condition: service_healthy   # espera real a que Postgres acepte conexiones
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
